<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">
        <h1>Todo App</h1>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter Your Task">

            <button id="addbtn">Add</button>
        </div>

        <input type="text" id="searchInput" placeholder="search task...">

        <div class="filter-buttons">
            <button id="allbtn">All</button>
            <button id="pendingbtn">Pending</button>
            <button id="completedbtn">Completed</button>
        </div>

        <div class="task-count">
            <span id="totalCount">Total: 0</span>
            <span id="pendingCount">Pending: 0</span>
            <span id="completedCount">Completed: 0</span>
        </div>
        <ul id="taskList">

        </ul>
    </div>

    <script src="app.js"></script>
</body>

</html>
